<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organigramma gara di orienteering</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mut:#66706a;--line:#dde2dc;--ac:#1f7a4d;--acx:#fff;--warn:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#1d231f;--tx:#e8ece8;--mut:#98a39b;--line:#323b35;--ac:#4cc48a;--acx:#0d1a12;--warn:#ff8a80}}
:root[data-theme="dark"]{--bg:#141815;--card:#1d231f;--tx:#e8ece8;--mut:#98a39b;--line:#323b35;--ac:#4cc48a;--acx:#0d1a12;--warn:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 14px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
button,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.x{color:var(--warn)}
input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;border-left:6px solid var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:6px;margin-top:6px}
.badge{font-size:12px;color:var(--mut)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.tl{min-width:760px}
.tr{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.nm{font-size:13px;overflow:hidden}.nm small{display:block;color:var(--mut)}
.trk{position:relative;height:30px;border-left:1px solid var(--line);border-right:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/var(--n)) 100%}
.seg{position:absolute;top:3px;height:24px;border-radius:5px;color:#fff;font-size:11px;padding:3px 5px;overflow:hidden;white-space:nowrap;text-shadow:0 0 2px rgba(0,0,0,.5)}
.ax{display:grid;grid-template-columns:150px 1fr;gap:8px;margin-bottom:4px}
.ticks{position:relative;height:16px;font-size:11px;color:var(--mut)}.ticks span{position:absolute;transform:translateX(-50%)}
.warn{color:var(--warn);font-weight:600}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.empty{color:var(--mut);padding:20px;text-align:center}
.orow{display:grid;grid-template-columns:1fr 140px 40px;gap:6px;margin-top:6px}
.prow{display:grid;grid-template-columns:1.1fr 1.3fr auto;gap:8px;align-items:center;margin-top:8px}
.prow small{display:block;color:var(--mut)}
.ob{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid var(--line);font-size:13px}.ob i{width:9px;height:9px;border-radius:50%;flex:none}
.done{text-decoration:line-through;color:var(--mut)}
@media(max-width:600px){.orow,.prow{grid-template-columns:1fr}}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:4px 8px;align-items:end;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.frow .w{grid-column:span 2}.frow .v{padding:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
.wd{font-size:11px;color:var(--mut);text-align:center}
.cd{min-height:56px;padding:4px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;border-radius:8px;font-size:13px}
.cd.fu{background:color-mix(in srgb,var(--ac) 20%,var(--card));border-color:var(--ac)}
.cd.td{outline:2px solid var(--tx);outline-offset:-2px}
.cd.sel{box-shadow:0 0 0 2px var(--ac)}
.cd .ds{display:flex;gap:3px;flex-wrap:wrap;font-size:10px;color:var(--mut)}.cd .ds i{width:8px;height:8px;border-radius:50%}
.cd.pa{opacity:.75}
.cd.dl{background:color-mix(in srgb,#e5484d 18%,var(--card));border-color:#e5484d88}
.cd.du{background:#e5484d;border-color:#e5484d;color:#fff}.cd.du .ds{color:#fff}.cd.du .ds i{box-shadow:0 0 0 1px #fff}
.tree{--ln:var(--mut);display:flex;flex-direction:column;align-items:center;min-width:max-content;padding:6px 10px}
.trow,.srow{display:flex;justify-content:center;gap:10px}.srow{gap:0}
.bx{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center;min-width:130px;max-width:180px;font-size:13px}
.bx small{display:block;color:var(--mut);font-size:11px}
.bx.top{background:var(--ac);color:var(--acx);border-color:var(--ac);min-width:150px}.bx.top small{color:inherit;opacity:.85}
.bx.em{border-style:dashed;color:var(--mut)}
.stem{width:2px;height:22px;background:var(--ln)}
.col{position:relative;padding:22px 6px 0;display:flex;flex-direction:column;align-items:center}
.col::before,.col::after{content:'';position:absolute;top:0;width:50%;height:22px}
.col::before{right:50%;border-top:2px solid var(--ln)}
.col::after{left:50%;border-top:2px solid var(--ln);border-left:2px solid var(--ln)}
.col:first-child::before{border:0}.col:last-child::before{border-right:2px solid var(--ln)}.col:last-child::after{border:0}
.col:only-child::before{border:0}.col:only-child::after{border-top:0;border-left:2px solid var(--ln)}
.sw{display:flex;flex-direction:column;align-items:center}.sw::before{content:'';width:2px;height:8px;background:var(--ln)}
button[disabled]{opacity:.35;cursor:default}
.tg{border:0;background:transparent;padding:2px 6px;cursor:pointer;font-size:14px}
.tb td,.tb th{vertical-align:top;padding:6px 8px 6px 0;text-align:left}.tb tr+tr td{border-top:1px solid var(--line)}.tb th{color:var(--mut);font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;display:none;max-width:90%;z-index:9}
.ovr{background:color-mix(in srgb,#e5484d 14%,transparent)}.cmp{background:color-mix(in srgb,var(--ac) 16%,transparent)}
.frow.ovr,.frow.cmp{padding:8px 6px;border-radius:8px}.ob.ovr,.ob.cmp{padding:4px 6px;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>Organigramma gara di orienteering</h1>
<p class="sub" id="sub">Per ogni fase (Pre Evento, Giorno 1, Giorno 2): definisci i gruppi, assegna le persone, guarda il diagramma orario. Il Riepilogo mostra il carico di ogni persona su tutta la manifestazione. I dati restano salvati in questo browser.</p>
<div class="bar" id="genbar"><button class="pri" data-act="gen">Crea copia di sola lettura</button></div>
<div id="genout"></div>
<input type="file" id="jf" accept=".json,.txt" style="display:none">
<div id="toast"></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script id="appjs">
var ROD=document.getElementById('roData'),RO=!!ROD;var K='orienteering-org-v1',PAL=['#1f7a4d','#c2410c','#2563eb','#9333ea','#b45309','#0e7490','#be123c','#4d7c0f','#7c3aed','#475569'];
var PH=['Pre Evento','Giorno 1','Giorno 2'],S=migr(load()),tab='s',ph=0;
function migr(o){if(o&&o.phases)return fixP(o);var r={phases:PH.map(function(n){return{name:n,groups:[]}})};if(o&&o.groups)r.phases[1].groups=o.groups;return fixP(r)}
function ali(n){n=(n||'').trim();var k=n.toLowerCase(),P=S.pool||[];for(var i=0;i<P.length;i++){if(P[i].alias&&ppl(P[i].alias).some(function(a){return a.toLowerCase()==k}))return P[i].name}return n}
function nk(k){return String(k).toLowerCase().replace(/\s+/g,' ').trim().replace(/giorno\s*(\d)/,'giorno $1')}
function procRows(rows){var n=0;S.stage=S.stage||[];S.pool=S.pool||[];rows.forEach(function(row){var o={};Object.keys(row).forEach(function(k){o[nk(k)]=String(row[k]).trim()});
var full=((o['nome']||'')+' '+(o['cognome']||'')).trim();if(!full)return;
var r={name:full,alias:'',phone:o['numero di telefono']||o['telefono']||o['cellulare']||'',email:o['email']||o['e-mail']||'',n1:/^no$/i.test(o['giorno 1']||''),n2:/^no$/i.test(o['giorno 2']||'')};
var ex=S.pool.filter(function(q){return q.name.toLowerCase()==full.toLowerCase()})[0];if(ex)r.alias=ex.alias||'';
var d=S.stage.filter(function(q){return q.name.toLowerCase()==full.toLowerCase()})[0];if(d){r.alias=d.alias||r.alias;S.stage[S.stage.indexOf(d)]=r}else S.stage.push(r);n++});
save();return n}
function impRow(r){S.pool=S.pool||[];var ex=S.pool.filter(function(q){return q.name.toLowerCase()==r.name.toLowerCase()})[0];
if(ex){ex.n1=r.n1;ex.n2=r.n2;if(r.phone)ex.phone=r.phone;if(r.email)ex.email=r.email;if((r.alias||'').trim())ex.alias=r.alias.trim()}
else S.pool.push({name:r.name,note:'',phone:r.phone||'',email:r.email||'',n1:!!r.n1,n2:!!r.n2,alias:(r.alias||'').trim()})}
function impX(f){if(!f)return;if(!window.XLSX){toast('Libreria Excel non caricata: controlla la connessione.');return}
var r=new FileReader();r.onload=function(ev){var res;try{var wb=XLSX.read(ev.target.result,{type:'array'});res=procRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))}catch(e){toast('Impossibile leggere il file.');return}
render()};r.readAsArrayBuffer(f)}
function sh(n){n=(n||'').trim();if(!n)return'';var k=n.toLowerCase(),P=S.pool||[];for(var i=0;i<P.length;i++){var q=P[i],A=ppl(q.alias||'');if(q.name.toLowerCase()==k||A.some(function(a){return a.toLowerCase()==k}))return A[0]||n}return n}
var MSG='',NT='',CF='',EX={},EDT={};
function toast(t){var e=document.getElementById('toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},6000)}
async function expData(){var txt=JSON.stringify(S),box=document.getElementById('genout');
try{var d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:'organigramma-gara-dati.json',data:txt});toast('Dati esportati. Per ripristinarli usa «Importa dati» e scegli questo file.');return}}catch(e){if(e&&e.code=='declined')return}
box.innerHTML='<div class="card" style="--c:var(--ac)"><b>Dati esportati</b><p class="sub">Il salvataggio diretto non è disponibile: copia tutto il testo qui sotto in un file di testo chiamato <b>organigramma-dati.json</b>. Per ripristinarlo usa «Importa dati» e scegli quel file.</p><textarea readonly style="width:100%;height:140px;font:12px monospace" onfocus="this.select()">'+esc(txt)+'</textarea></div>'}
function impJ(f){if(!f)return;var r=new FileReader();r.onload=function(ev){try{var n=migr(JSON.parse(ev.target.result));if(!n.phases||n.phases.length!=3)throw 0;S=n;save();render();toast('Dati importati.')}catch(e){toast('File non valido: scegli un file esportato con «Esporta dati».')}};r.readAsText(f)}
function cpyG(m){var from=ph==1?2:1,src=S.phases[from].groups,dst=G(),add=0,skip=0;
src.forEach(function(g){var k=gk(g);if(k&&dst.some(function(x){return gk(x)==k})){skip++;return}
var c=JSON.parse(JSON.stringify(g));
if(m!='p'){c.leader='';c.ls='';c.le='';c.slots=(c.slots||[]).map(function(){return{name:'',start:'',end:''}})}
dst.push(c);add++});
NT=src.length?'Copiati '+add+' settori da '+PH[from]+(skip?' ('+skip+' già presenti, non toccati)':'')+(m=='p'?', con responsabili e persone.':', senza responsabili e persone.'):'Non ci sono settori in '+PH[from]+' da copiare.'}
function renameRefs(o,n){var ko=o.toLowerCase();function fx(v){return(v||'').trim().toLowerCase()==ko?n:v}
S.phases.forEach(function(P){P.groups.forEach(function(g){g.leader=fx(g.leader);(g.slots||[]).forEach(function(x){x.name=fx(x.name)});(g.obj||[]).forEach(function(b){b.r=fx(b.r);var T=ppl(b.p);if(T.some(function(z){return z.toLowerCase()==ko}))b.p=T.map(fx).join(', ')})})});
if(S.top)['dg','dt','pr'].forEach(function(k){S.top[k]=fx(S.top[k])})}
function commitName(t){var q=(S.pool||[])[+t.dataset.pi];if(!q)return;var nv=t.value.trim();if(nv==q.name)return;
if(!nv){t.value=q.name;return}
if(S.pool.some(function(z){return z!==q&&z.name.toLowerCase()==nv.toLowerCase()})){MSG='Esiste già una persona chiamata «'+nv+'»: il nome non è stato modificato.';t.value=q.name;return}
var old=q.name,ko=old.toLowerCase(),kn=nv.toLowerCase();q.name=nv;renameRefs(old,nv);
if(('r:'+ko) in EX){EX['r:'+kn]=EX['r:'+ko];delete EX['r:'+ko]}if(ko in EDT){EDT[kn]=EDT[ko];delete EDT[ko]}save()}
function gk(g){return(g.name||'').trim().toLowerCase()}
function syncCol(src){var map={};if(src&&gk(src))map[gk(src)]=src.color;
S.phases.forEach(function(P){P.groups.forEach(function(g){var k=gk(g);if(!k)return;if(!(k in map))map[k]=g.color;g.color=map[k]})})}
function adoptCol(g){var k=gk(g);if(!k)return false;for(var i=0;i<S.phases.length;i++){var A=S.phases[i].groups;for(var j=0;j<A.length;j++){if(A[j]!==g&&gk(A[j])==k){g.color=A[j].color;return true}}}return false}
function ob(){return{t:'',p:'',r:'',d:'',e:'',ok:false,dl:false,dd:''}}
function inv(o){var P=ppl(o.p).map(ali),r=ali(o.r);if(r&&!P.some(function(n){return n.toLowerCase()==r.toLowerCase()}))P.push(r);return P}
function overdue(o){return !!(!o.ok&&o.dl&&o.dd&&o.dd<today())}
function dleft(o){return Math.round((Date.parse(o.dd)-Date.parse(today()))/864e5)}
function urg(o){return !!(o.dl&&o.dd&&!o.ok&&dleft(o)<5)}
function dlab(n){return n<0?'scaduta':n==0?'oggi':n==1?'domani':'tra '+n+' giorni'}
function stato(o){return o.ok?'Completata':(o.d&&o.d<=today())?'In corso':'Da iniziare'}
function scol(o){return o.ok?'var(--ac)':stato(o)=='In corso'?'var(--tx)':'var(--mut)'}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function orow(i,j,o,st){var a='data-g="'+i+'" data-o="'+j+'"';
return'<div class="frow'+(o.ok?' cmp':overdue(o)?' ovr':'')+'"><div class="w"><label>Obiettivo</label>'+(st?'<input '+a+' data-f="t" placeholder="Obiettivo o compito" value="'+esc(o.t)+'">':'<div class="v">'+(esc(o.t)||'<i class="badge">(senza titolo)</i>')+'</div>')+'</div>'
+'<div class="w"><label>Persone</label><input '+a+' data-f="p" placeholder="una o più, separate da virgola" value="'+esc(o.p)+'"></div>'
+'<div class="w"><label>Referente</label><input '+a+' data-f="r" placeholder="persona di riferimento" value="'+esc(o.r||'')+'"></div>'
+'<div><label>Stato</label><div class="v"><b style="color:'+scol(o)+'">'+stato(o)+'</b><label style="display:flex;gap:6px;align-items:center;color:var(--tx);font-size:13px;margin:2px 0 0"><input type="checkbox" style="width:auto" '+a+' data-f="ok"'+(o.ok?' checked':'')+'> Completato</label></div></div>'
+'<div><label>Data inizio</label><input type="date" '+a+' data-f="d" value="'+(o.d||'')+'"></div>'
+'<div><label>Data fine</label><div class="v">'+(o.e?fd(o.e):'<span class="badge">—</span>')+'</div></div>'
+'<div><label>Scadenza (facoltativa)</label><label class="v" style="display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:0;padding-bottom:2px"><input type="checkbox" style="width:auto" '+a+' data-f="dl"'+(o.dl?' checked':'')+'> Scadenza</label>'+(o.dl?'<input type="date" '+a+' data-f="dd" value="'+(o.dd||'')+'">':'')+'</div>'
+(st?'<div><button class="x" data-act="delo" data-g="'+i+'" data-o="'+j+'">Rimuovi</button></div>':'')+'</div>'}
function ppl(s){return(s||'').split(/[,;\n]/).map(function(x){return x.trim()}).filter(Boolean)}
function fixP(o){o.pool=o.pool||[];o.stage=o.stage||[];o.top=o.top||{dg:'',dt:'',pr:''};o.phases[0].groups.forEach(function(g){if(!g.obj){g.obj=[];var n=(g.slots||[]).map(function(x){return x.name.trim()}).filter(Boolean);g.obj.push(n.length?{t:'Da definire',p:n.join(', '),d:'',ok:false}:ob())}});return o}
function fd(d){if(!d)return'';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function G(){return(S.phases[ph]||{groups:[]}).groups}
function load(){try{return JSON.parse(RO?ROD.textContent:localStorage.getItem(K))}catch(e){return null}}
function save(){if(RO)return;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tm(t){var p=(t||'').split(':');return p.length<2?NaN:(+p[0])*60+(+p[1])}
function fm(m){return Math.floor(m/60)+':'+('0'+m%60).slice(-2)}
function newG(){var i=G().length;if(ph==0)return{name:'Gruppo '+(i+1),leader:'',color:PAL[i%PAL.length],obj:[ob()]};return{name:'Gruppo '+(i+1),leader:'',color:PAL[i%PAL.length],start:'08:00',end:'16:00',ls:'',le:'',slots:[{name:'',start:'',end:''}]}}
function slot(){return{name:'',start:'',end:''}}
function tabs(){var top=PH.map(function(n,i){return'<button data-act="ph" data-p="'+i+'" class="'+(ph==i?'on':'')+'">'+n+'</button>'}).join('')+'<button data-act="ph" data-p="3" class="'+(ph==3?'on':'')+'">Riepilogo persone</button>';
if(ph==3){document.getElementById('tabs').innerHTML=top;return}
document.getElementById('tabs').innerHTML=top+'<div style="flex-basis:100%;height:0"></div>'+(RO?(ph==0?[['s','Obiettivi'],['d','Per persona'],['c','Calendario']]:[['o','Organigramma'],['d','Diagramma']]):[['s','Settore'],['p','Persone'],['d',ph==0?'Per persona':'Diagramma']].concat(ph==0?[['c','Calendario']]:[['o','Organigramma']])).map(function(t){return'<button data-act="tab" data-t="'+t[0]+'" class="'+(tab==t[0]?'on':'')+'" style="'+(tab==t[0]?'':'background:transparent')+'">'+t[1]+'</button>'}).join('')}
function viewS(){
var o=ph==1?2:1,nt=NT;NT='';
var h=(nt?'<p class="sub" style="color:var(--ac)">'+esc(nt)+'</p>':'')+'<div class="bar"><button data-act="cpy" data-m="s">Copia settori da '+PH[o]+'</button><button data-act="cpy" data-m="p">Copia settori e persone da '+PH[o]+'</button><button class="pri" data-act="addg">+ Nuovo gruppo di lavoro</button><button data-act="exp">Esporta dati</button><button data-act="imp">Importa dati</button><button class="x" data-act="reset"'+(CF=='reset'?' style="background:var(--warn);color:var(--bg)"':'')+'>'+(CF=='reset'?'Conferma: cancella tutto?':'Azzera tutto')+'</button></div>';
if(!G().length)h+='<div class="empty">Nessun gruppo ancora. Aggiungi il primo (es. Partenza, Arrivo, Segreteria, Percorsi…).</div>';
G().forEach(function(g,i){h+='<div class="card" style="--c:'+g.color+'"><div class="grid">'
+'<div style="grid-column:span 2"><label>Gruppo / campo d\'impiego</label><input data-g="'+i+'" data-f="name" value="'+esc(g.name)+'"></div>'
